<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- background -->
  <rect width="100" height="100" rx="22" fill="#0b0b12"/>
  <!-- clock body -->
  <circle cx="50" cy="56" r="34" fill="#14141f" stroke="#f0a500" stroke-width="4.5"/>
  <!-- tick marks -->
  <line x1="50" y1="26" x2="50" y2="31" stroke="#56536a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="81" x2="50" y2="86" stroke="#56536a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="56" x2="25" y2="56" stroke="#56536a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="56" x2="80" y2="56" stroke="#56536a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- hour hand -->
  <line x1="50" y1="56" x2="50" y2="37" stroke="#e8e4d9" stroke-width="3.5" stroke-linecap="round"/>
  <!-- minute hand -->
  <line x1="50" y1="56" x2="65" y2="64" stroke="#f0a500" stroke-width="3" stroke-linecap="round"/>
  <!-- center dot -->
  <circle cx="50" cy="56" r="3.5" fill="#f0a500"/>
  <!-- crown -->
  <rect x="44" y="18" width="12" height="4.5" rx="2" fill="#e8e4d9"/>
  <rect x="47" y="14" width="6" height="6" rx="2" fill="#56536a"/>
</svg>
